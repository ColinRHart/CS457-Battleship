          #!/bin/sh
          # CH-Server startup configuration

          hostname CH-Server

          # Login credentials
          USERNAME=cisco
          PASSWORD=cisco

          # Configure static IP
          ip link set eth0 up
          ip addr add 192.168.20.100/24 dev eth0

          # Configure default gateway
          ip route replace default via 192.168.20.1

          # Configure DNS
          echo "nameserver 192.168.20.1" > /etc/resolv.conf
